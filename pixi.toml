[workspace]
name = "edgegate-slam"
version = "0.1.0"
description = "GNN-based per-edge inlier confidence for pose-graph SLAM"
channels = ["conda-forge", "pytorch", "nvidia"]
platforms = ["linux-64"]

# ── shared dependencies (both environments) ───────────────────────────────────
[dependencies]
python = "3.11.*"
numpy = ">=2"
scipy = ">=1.13"
matplotlib = ">=3.9"
tqdm = ">=4.66"
pytest = ">=8"
gtsam = ">=4.2"
hydra-core = ">=1.3"
wandb = ">=0.17"

[pypi-dependencies]
edgegate-slam = { path = ".", editable = true }
pypose = ">=0.6"
rerun-sdk = ">=0.18"
torch-geometric = ">=2.5"

# ── cpu feature — data work, unit tests, no CUDA required ─────────────────────
[feature.cpu.dependencies]
pytorch = { version = ">=2.4,<2.6", channel = "pytorch" }
cpuonly = { version = "*", channel = "pytorch" }

# ── gpu feature — full CUDA 12.4 training ─────────────────────────────────────
[feature.gpu.system-requirements]
cuda = "12"

[feature.gpu.dependencies]
pytorch = { version = ">=2.4,<2.6", channel = "pytorch" }
pytorch-cuda = { version = "12.4.*", channel = "pytorch" }
cuda-version = "12.4.*"

# torch-scatter / torch-sparse / torch-cluster are optional in PyG >= 2.4.
# Add them here via find-links if a specific op requires them:
#   [feature.gpu.pypi-options]
#   find-links = [{url = "https://data.pyg.org/whl/torch-<version>+cu124.html"}]
#   [feature.gpu.pypi-dependencies]
#   torch-scatter = "*"

# ── environments ──────────────────────────────────────────────────────────────
[environments]
default = { features = ["gpu"], solve-group = "gpu" }
gpu    = { features = ["gpu"], solve-group = "gpu" }
cpu    = { features = ["cpu"], solve-group = "cpu" }

# ── tasks ─────────────────────────────────────────────────────────────────────
[tasks]
train              = "python scripts/train.py"
evaluate           = "python scripts/evaluate.py"
gen-synthetic      = "python scripts/generate_synthetic.py"
download-benchmarks = "python scripts/download_benchmarks.py"
demo-rerun         = "python scripts/demo_rerun.py"
test               = "pytest tests/ -v"
