outlier_rate: 30          # percentage of loop-closure edges that are outliers
outlier_structure: random  # random | clustered
num_poses: 100
num_loop_closures: 20
lc_ratio: null              # target poses-per-LC ratio; overrides num_loop_closures when set
segment_length: 5           # mean steps per Manhattan-world segment (smaller = more revisits)
proximity_threshold: 3.0    # max Euclidean distance for inlier LC candidates
info_scale: 1.0             # scalar multiplier on LC info matrix (odometry fixed)
seed: 42
